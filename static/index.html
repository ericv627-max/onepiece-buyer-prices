<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VENDR · Price it. Stack it. Flip it.</title>
  <!-- What shows when someone shares the link in a text or chat. -->
  <meta name="description" content="VENDR: look up any One Piece TCG card and see what a buyer should offer, based on today's TCGplayer prices. Updated daily.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="VENDR · Price it. Stack it. Flip it.">
  <meta property="og:description" content="Look up any One Piece TCG card and see what a buyer should offer, based on today's TCGplayer prices. Updated daily.">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#07070d">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2307070d'/><path d='M6 7h5l5 13 5-13h5L18.5 26h-5z' fill='%2300f0ff'/></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
    /* ---------- Colors: dark base with neon accents ---------- */
    :root {
      --bg: #07070d;
      --surface: #0e0e19;
      --surface-2: #151527;
      --line: #25253f;
      --fg: #e8e8f4;
      --muted: #9090b0;        /* still 6:1 on the surface colour, so it stays readable */
      --cyan: #00f0ff;         /* main neon: focus, links, the logo */
      --magenta: #ff2bd6;      /* action buttons and the slogan */
      --yellow: #f5ee30;       /* warnings and "note" text */
      --good: #3dff8f;         /* buyer prices */
      --display: "Orbitron", "Arial Black", sans-serif;
      --body: "Chakra Petch", system-ui, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
      color-scheme: dark;
    }

    /* ---------- Page layout ---------- */
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--fg); font-family: var(--body); font-size: 15px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 240, 255, 0.12), transparent 70%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(255, 43, 214, 0.08), transparent 70%),
        var(--bg);
      background-attachment: fixed;
    }
    /* Faint grid and scanlines over everything, for the cyberpunk screen feel. */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 70%);
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 3px);
    }
    main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 36px 16px 56px; display: grid; gap: 16px; }

    /* ---------- Logo and slogan ---------- */
    header { display: grid; gap: 6px; }
    .brand { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 16px; }
    h1 {
      margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(2.6rem, 8vw, 4rem);
      letter-spacing: 0.08em; line-height: 1; color: var(--fg);
      text-shadow: -2px 0 var(--magenta), 2px 0 var(--cyan), 0 0 24px rgba(0, 240, 255, 0.35);
    }
    .slogan {
      margin: 0; font-family: var(--mono); font-size: 0.9rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--magenta);
    }
    .sub { margin: 0; font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
    .sub .live { color: var(--good); }
    .note {
      border: 1px solid var(--line); border-left: 3px solid var(--yellow); background: rgba(245, 238, 48, 0.05);
      padding: 9px 14px; line-height: 1.45; font-size: 0.92rem; color: var(--muted);
    }
    .note strong { color: var(--yellow); font-weight: 600; }

    /* ---------- The search bar ---------- */
    .search-wrap { position: relative; }
    .search-wrap::before {
      content: ">"; position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      font-family: var(--mono); font-weight: 600; font-size: 1.2rem; color: var(--cyan); pointer-events: none;
    }
    #search {
      width: 100%; padding: 16px 120px 16px 40px; font: inherit; font-family: var(--mono); font-size: 1.1rem;
      color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 0;
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #search::placeholder { color: #5c5c7c; }
    #search:focus-visible { outline: none; border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan), 0 0 24px rgba(0, 240, 255, 0.15); }
    #search::-webkit-search-cancel-button { filter: invert(1) hue-rotate(150deg); }
    .search-hint {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      font-family: var(--mono); font-size: 0.72rem; color: var(--muted); pointer-events: none;
    }
    .search-hint kbd {
      font-family: inherit; border: 1px solid var(--line); padding: 1px 5px; color: var(--cyan);
    }

    /* ---------- Chips: recent searches and example searches ---------- */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.85rem; }
    .chips-label {
      font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
      margin-right: 4px;
    }
    .chip {
      display: inline-flex; align-items: center; font: inherit; font-size: 0.85rem; color: var(--fg);
      background: var(--surface); border: 1px solid var(--line); border-radius: 0;
    }
    .chip button {
      font: inherit; color: inherit; background: none; border: 0; padding: 4px 10px; cursor: pointer;
    }
    .chip .remove { padding: 4px 8px 4px 2px; color: var(--muted); }
    .chip:hover, .chip:focus-within { border-color: var(--cyan); color: var(--cyan); }
    .chip .remove:hover, .chip .remove:focus-visible { color: var(--magenta); }
    .chip button:focus-visible { outline: none; text-decoration: underline; }
    .link-btn {
      font: inherit; font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); background: none; border: 0; padding: 4px 6px; cursor: pointer;
    }
    .link-btn:hover, .link-btn:focus-visible { color: var(--magenta); outline: none; }

    /* ---------- Section heading above the results ---------- */
    .results-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    #status { margin: 0; color: var(--muted); font-size: 0.92rem; }
    #status b { font-family: var(--mono); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan); margin-right: 8px; }

    /* ---------- The grid of card results ---------- */
    #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .card {
      position: relative; background: linear-gradient(180deg, var(--surface-2), var(--surface));
      border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
      transition: border-color 0.15s, transform 0.15s;
    }
    .card:hover { border-color: rgba(0, 240, 255, 0.55); transform: translateY(-2px); }
    .card img {
      width: 100%; aspect-ratio: 5 / 7;  /* trading-card shape */
      object-fit: contain; background: var(--bg); margin-bottom: 6px;
    }
    .name { font-weight: 600; font-size: 1rem; overflow-wrap: anywhere; }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .meta b { font-family: var(--mono); font-weight: 600; color: var(--cyan); }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      font-family: var(--mono); font-size: 0.66rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--magenta); border: 1px solid rgba(255, 43, 214, 0.45); padding: 1px 6px;
    }
    .tag.foil { color: var(--yellow); border-color: rgba(245, 238, 48, 0.45); }
    .prices { margin: 8px 0; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
    .prices div { display: flex; justify-content: space-between; gap: 8px; }
    .prices span:last-child { white-space: nowrap; }
    .offer-label { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    /* The buyer range is the answer; listing and market are just the working. */
    .offer {
      font-family: var(--body); font-size: 1.75rem; font-weight: 700; line-height: 1.1; color: var(--good);
      text-shadow: 0 0 14px rgba(61, 255, 143, 0.35); margin-bottom: 6px; white-space: nowrap;
    }
    /* Long ranges ("$1,079.96 – $1,199.95") step down so they stay on one line. */
    .offer.long { font-size: 1.4rem; }
    .offer.longer { font-size: 1.15rem; }
    .none { font-size: 1.2rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .ref { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
    .card a {
      margin-top: auto; text-align: center; padding: 9px 6px; font-weight: 700; font-size: 0.9rem; text-decoration: none; white-space: nowrap;
      color: var(--bg); background: var(--cyan);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
    }
    .card a:hover, .card a:focus-visible { background: var(--magenta); outline: none; }

    footer { color: var(--muted); font-size: 0.82rem; line-height: 1.5; font-family: var(--mono); }

    /* Phones: smaller pictures so prices fit on screen; drop the keyboard hint. */
    @media (max-width: 520px) {
      .card img { width: 60%; align-self: center; }
      .search-hint { display: none; }
      #search { padding-right: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, #search { transition: none; }
      .card:hover { transform: none; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <h1>VENDR</h1>
      <p class="slogan">Price it. Stack it. Flip it.</p>
    </div>
    <p class="sub" id="updated">Loading prices...</p>
  </header>

  <div class="note">
    <strong>Prices reflect all conditions.</strong>
    Buyer offer is <span id="percents">80% to 90%</span> of the lowest TCGplayer listing.
  </div>

  <div class="search-wrap">
    <input id="search" type="search" autocomplete="off" spellcheck="false" aria-label="Search cards"
           placeholder="Card name, number (OP01-001), set, or printing">
    <span class="search-hint" id="search-hint" hidden><kbd>Tab</kbd> to search this</span>
  </div>

  <!-- Filled in by the script: recent searches if there are any, otherwise example searches. -->
  <div class="chips" id="chips"></div>

  <div class="results-head">
    <p id="status"></p>
    <button type="button" class="link-btn" id="reroll" hidden>↻ New pulls</button>
  </div>
  <div id="results"></div>

  <footer>VENDR · prices from TCGplayer via tcgcsv.com, updated daily. Not affiliated with TCGplayer or Bandai.</footer>
</main>

<script>
  const MAX_RESULTS = 100;
  const MAX_RECENT = 8;
  const RECENT_KEY = "vendr.recentSearches";
  const EXAMPLES = ["luffy op01-003", "shanks manga", "zoro alt art", "don gold"];
  let cards = [];        // every card, filled in once cards.json loads
  let searchText = [];   // lowercase text to search in, one per card

  // ---------- Helpers ----------

  // Turn 1079.5 into "$1,079.50". Show a dash when there's no price.
  function money(value) {
    if (value === null) return "—";
    return value.toLocaleString("en-US", { style: "currency", currency: "USD" });
  }

  // Make text safe to put inside HTML (stops card names from breaking the page).
  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text ?? "";
    return div.innerHTML;
  }

  function randomItem(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  // Turn the UTC update time into "today, 5:31 PM" in the visitor's own time zone.
  // Older builds only have a date, so show that as it is.
  function whenUpdated(data) {
    if (!data.updated_at) return data.updated;
    const when = new Date(data.updated_at);
    const time = when.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const dayKey = d => d.toDateString();
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (dayKey(when) === dayKey(new Date())) return `today, ${time}`;
    if (dayKey(when) === dayKey(yesterday)) return `yesterday, ${time}`;
    return when.toLocaleDateString([], { month: "short", day: "numeric" }) + `, ${time}`;
  }

  // ---------- Recently searched (saved in this browser only) ----------
  // Storage can be blocked (private windows), so every read and write is wrapped.
  function loadRecent() {
    try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; }
  }
  function saveRecentList(list) {
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch { /* not saved; that's fine */ }
  }
  function rememberSearch(query) {
    query = query.trim();
    if (query.length < 2) return;
    const list = loadRecent().filter(q => q.toLowerCase() !== query.toLowerCase());
    list.unshift(query);
    saveRecentList(list.slice(0, MAX_RECENT));
    renderChips();
  }
  function forgetSearch(query) {
    saveRecentList(loadRecent().filter(q => q !== query));
    renderChips();
  }

  // Show recent searches when there are some, otherwise a few examples to try.
  const chipsBox = document.getElementById("chips");
  function renderChips() {
    const recent = loadRecent();
    if (recent.length === 0) {
      chipsBox.innerHTML = `<span class="chips-label">Try</span>` + EXAMPLES.map(q =>
        `<span class="chip"><button type="button" data-q="${escapeHtml(q)}">${escapeHtml(q)}</button></span>`).join("");
      return;
    }
    chipsBox.innerHTML = `<span class="chips-label">Recent</span>` + recent.map(q => `
      <span class="chip">
        <button type="button" data-q="${escapeHtml(q)}">${escapeHtml(q)}</button>
        <button type="button" class="remove" data-forget="${escapeHtml(q)}" aria-label="Remove ${escapeHtml(q)} from recent searches">×</button>
      </span>`).join("") +
      `<button type="button" class="link-btn" data-clear>Clear</button>`;
  }
  chipsBox.addEventListener("click", event => {
    const button = event.target.closest("button");
    if (!button) return;
    if (button.dataset.forget !== undefined) return forgetSearch(button.dataset.forget);
    if (button.dataset.clear !== undefined) { saveRecentList([]); return renderChips(); }
    searchBox.value = button.dataset.q;
    runSearch();
    rememberSearch(button.dataset.q);
  });

  // ---------- Build the HTML for one card ----------
  function cardHtml(card) {
    let prices;
    if (card.low === null) {
      // No listing price means nothing to calculate.
      prices = `
        <span class="offer-label">Buyer pays</span>
        <span class="none">No current listing</span>
        <div class="ref"><span>Market price</span><span>${money(card.market)}</span></div>`;
    } else {
      const range = `${money(card.buyer_min)} – ${money(card.buyer_max)}`;
      const size = range.length > 19 ? " longer" : range.length > 15 ? " long" : "";
      prices = `
        <span class="offer-label">Buyer pays</span>
        <span class="offer${size}">${range}</span>
        <div class="ref"><span>Listing (low)</span><span>${money(card.low)}</span></div>
        <div class="ref"><span>Market price</span><span>${money(card.market)}</span></div>`;
    }

    // If the big picture fails to load, fall back to the standard size.
    return `
      <article class="card">
        <img src="${escapeHtml(card.image)}" alt="${escapeHtml(card.name)}" loading="lazy"
             onerror="this.onerror = null; this.src = this.src.replace('_400w', '_200w');">
        <div class="name">${escapeHtml(card.name)}</div>
        <div class="meta">${card.number ? `<b>${escapeHtml(card.number)}</b> · ` : ""}${escapeHtml(card.set)}</div>
        <div class="tags">
          <span class="tag">${escapeHtml(card.printing)}</span>
          ${card.foil ? '<span class="tag foil">Foil</span>' : ""}
        </div>
        <div class="prices">${prices}</div>
        <a href="${escapeHtml(card.url)}" target="_blank" rel="noopener">Latest sales on TCGplayer ↗</a>
      </article>`;
  }

  // ---------- Searching ----------
  const searchBox = document.getElementById("search");
  const statusText = document.getElementById("status");
  const resultsBox = document.getElementById("results");
  const rerollButton = document.getElementById("reroll");

  // When nothing matches, say which word is the problem instead of
  // leaving a dead end. Every word has to match, so one typo hides everything.
  function noMatchesHelp(words) {
    const missing = words.filter(word => !searchText.some(text => text.includes(word)));
    if (missing.length > 0) {
      return `No cards found. Nothing matches "${missing.join('", "')}". ` +
        "Check the spelling, or search a card number like OP01-001.";
    }
    return "No cards found. Each word matches on its own, but no single card has all of them. Try fewer words.";
  }

  // With an empty search box, show a few random cards worth looking at
  // (ones with a real price), so the page is never blank.
  let pullPool = [];
  function showRandomPulls() {
    const picks = new Set();
    while (picks.size < Math.min(6, pullPool.length)) picks.add(randomItem(pullPool));
    statusText.innerHTML = "<b>Random pulls</b>Six cards from today's prices. Search above for your own.";
    resultsBox.innerHTML = [...picks].map(cardHtml).join("");
    rerollButton.hidden = false;
  }
  rerollButton.addEventListener("click", showRandomPulls);

  // Every word typed must appear somewhere in the card's text,
  // so "luffy op05" finds Luffy cards from OP05.
  function runSearch() {
    const query = searchBox.value.trim().toLowerCase();
    history.replaceState(null, "", query ? "?q=" + encodeURIComponent(searchBox.value.trim()) : location.pathname);
    if (query.length < 2) {
      showRandomPulls();
      return;
    }
    rerollButton.hidden = true;

    const words = query.split(/\s+/);
    const matches = [];
    for (let i = 0; i < cards.length && matches.length < MAX_RESULTS; i++) {
      if (words.every(word => searchText[i].includes(word))) {
        matches.push(cards[i]);
      }
    }

    const count = matches.length;
    statusText.textContent = count === 0 ? noMatchesHelp(words)
      : count === MAX_RESULTS ? "Showing the first 100 matches. Add a word to narrow it down."
      : `${count} card${count === 1 ? "" : "s"} found.`;
    resultsBox.innerHTML = matches.map(cardHtml).join("");
  }

  // A search counts as "recent" once the person stops typing for a moment and it
  // found something, or as soon as they press Enter or open a card's sales link.
  let rememberTimer;
  searchBox.addEventListener("input", () => {
    runSearch();
    clearTimeout(rememberTimer);
    rememberTimer = setTimeout(() => {
      if (resultsBox.children.length > 0 && searchBox.value.trim().length >= 2) rememberSearch(searchBox.value);
    }, 1500);
    updateHint();
  });
  searchBox.addEventListener("keydown", event => {
    if (event.key === "Enter") rememberSearch(searchBox.value);
    // Tab or → on an empty box takes the suggestion shown in grey.
    if ((event.key === "Tab" || event.key === "ArrowRight") && searchBox.value === "" && currentSuggestion) {
      event.preventDefault();
      searchBox.value = currentSuggestion;
      runSearch();
      rememberSearch(currentSuggestion);
      updateHint();
    }
  });
  resultsBox.addEventListener("click", event => {
    if (event.target.closest("a") && searchBox.value.trim().length >= 2) rememberSearch(searchBox.value);
  });

  // ---------- The grey suggestion in the empty search box ----------
  // Every few seconds it types out a different real card, like "Nami OP01-016".
  // Tab takes it. People who prefer less motion get it swapped in without the typing.
  let currentSuggestion = "";
  const searchHint = document.getElementById("search-hint");
  const calmMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function updateHint() {
    searchHint.hidden = !(searchBox.value === "" && currentSuggestion);
  }

  function suggestionFor(card) {
    // Drop the "(Parallel)" style bits so the suggestion reads like something a person would type.
    const name = card.name.replace(/\s*[(\[].*$/, "");
    return card.number ? `${name} ${card.number}` : name;
  }

  function startSuggestions() {
    const pool = pullPool.filter(card => card.number);
    if (pool.length === 0) return;
    let text = "", shown = 0, phase = "pause";

    function next() {
      text = suggestionFor(randomItem(pool));
      shown = 0;
      phase = "typing";
    }

    next();
    if (calmMotion) {
      const swap = () => { currentSuggestion = text; searchBox.placeholder = text; updateHint(); next(); };
      swap();
      setInterval(swap, 4000);
      return;
    }
    setInterval(() => {
      if (phase === "typing") {
        shown++;
        searchBox.placeholder = text.slice(0, shown) + (shown < text.length ? "▌" : "");
        if (shown >= text.length) { phase = "holding"; currentSuggestion = text; updateHint(); setTimeout(() => { phase = "done"; }, 2600); }
      } else if (phase === "done") {
        next();
      }
    }, 55);
  }

  // ---------- Load the card data, then start ----------
  renderChips();
  fetch("cards.json")
    .then(response => response.json())
    .then(data => {
      cards = data.cards;
      searchText = cards.map(card =>
        [card.name, card.number, card.set, card.printing, card.foil ? "foil" : ""].join(" ").toLowerCase());
      // Random pulls and suggestions come from cards worth at least $5, so they're interesting.
      pullPool = cards.filter(card => card.low !== null && card.low >= 5 && card.image);
      if (pullPool.length === 0) pullPool = cards;

      const pct = n => Math.round(n * 100) + "%";
      document.getElementById("percents").textContent =
        `${pct(data.buyer_min_percent)} to ${pct(data.buyer_max_percent)}`;
      document.getElementById("updated").innerHTML =
        `<span class="live">●</span> ${cards.length.toLocaleString()} cards · prices updated ${escapeHtml(whenUpdated(data))}`;

      // Use the search from the address (like ?q=luffy), or start with random pulls.
      searchBox.value = new URLSearchParams(location.search).get("q") || "";
      runSearch();
      startSuggestions();
    })
    .catch(() => {
      document.getElementById("updated").textContent =
        "Couldn't load cards.json. Run update_prices.py and build_site.py first.";
    });
</script>
</body>
</html>
