# Runs on every push: checks the Python scripts and the app build without
# downloading anything from tcgcsv (it uses the price files already saved).

name: Check

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python scripts compile
        run: python -m py_compile update_prices.py

      - name: Sealed product types are named correctly
        run: |
          python - <<'EOF'
          from update_prices import sealed_type
          cases = {
              "Extra Booster: Heroines Edition Vol.2 - Booster Box Case": "Case",
              "Extra Booster: Heroines Edition Vol.2 - Booster Box": "Booster Box",
              "Extra Booster: Heroines Edition Vol.2 - Sleeved Booster Pack": "Booster Pack",
              "Romance Dawn - Booster Pack": "Booster Pack",
              "Starter Deck 1: Straw Hat Crew": "Starter Deck",
              "One Piece Card Game Premium Card Collection": "Premium Collection",
              "Extra Booster: One Piece Heroines Edition Box": "Booster Box",
              "Extra Booster: One Piece Heroines Edition Pack": "Booster Pack",
              "One Piece Card Game Illustration Box Vol.1": "Illustration Box",
              "Judge Pack Vol. 3": "Promo Pack",
              "Special DON!! Card Pack DP-11": "Promo Pack",
              "The Time of Battle - Release Event Pack": "Promo Pack",
              "Sealed Battle Kit Vol. 1": "Battle Kit",
              "Starting Lineup": "Other Sealed",
              "Something Unusual": "Other Sealed",
          }
          for name, expected in cases.items():
              got = sealed_type(name)
              assert got == expected, f"{name!r}: expected {expected!r}, got {got!r}"
          print("sealed_type OK")

          from update_prices import product_language
          assert product_language("Marco (Japanese 1st Anniversary Set)") == "Japanese"
          assert product_language("One Piece Japanese Version 2nd Anniversary Set (Sealed Promotional Bundle)") == "Japanese"
          assert product_language("Monkey.D.Luffy (003) (Parallel)") == "English"
          assert product_language("English Version 1st Anniversary Set") == "English"
          print("product_language OK")
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # runs the TypeScript tests directly, with no extra packages
          cache: npm

      - name: App checks
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
