# Downloads fresh prices every night and saves them into this repo.
#
# How it works: tcgcsv.com updates prices around 20:00 UTC. An hour and a half
# later, this runs update_prices.py, which writes data/catalog.json (every card
# with today's prices) and data/history/<date>.json (today's prices, kept for
# the up/down arrows and charts). It commits those files to main, and Vercel
# rebuilds the site from that commit. Vercel never downloads prices itself,
# so prices are fetched from tcgcsv once a day, as they ask.
#
# Setup (one time): put the deploy hook link in this repo's
# Settings -> Secrets and variables -> Actions, as a secret named
# VERCEL_DEPLOY_HOOK. It's only used if the commit didn't start a rebuild.

name: Nightly price update

on:
  schedule:
    - cron: "30 21 * * *"   # every day at 21:30 UTC
  workflow_dispatch:         # adds a "Run workflow" button to update right now

permissions:
  contents: write            # lets the job commit the new price files

concurrency:
  group: nightly-update      # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download today's prices
        run: python update_prices.py

      - name: Sanity-check the download
        # A partial or empty reply from tcgcsv must never be saved and deployed.
        run: |
          python - <<'EOF'
          import json
          cards = json.load(open("data/catalog.json"))["cards"]
          priced = sum(1 for c in cards if c["market_price"] is not None)
          assert len(cards) > 5000, f"Only {len(cards)} products downloaded; not saving"
          assert priced > 3000, f"Only {priced} products have a price; not saving"
          sets = json.load(open("data/sets.json"))["sets"]
          assert len(sets) > 50, f"Only {len(sets)} sets downloaded; not saving"
          # If tcgcsv stops refreshing, fail loudly (GitHub emails you) instead of quietly saving stale prices.
          from datetime import datetime, timezone
          updated = datetime.fromisoformat(json.load(open("data/catalog.json"))["updated_at"])
          age = datetime.now(timezone.utc) - updated
          assert age.days < 3, f"tcgcsv's prices are {age.days} days old; it may have stopped updating"
          print(f"{len(cards)} products ({priced} priced), {len(sets)} sets, prices from {updated:%Y-%m-%d %H:%M} UTC: OK")
          EOF

      - name: Save the price files to the repo
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Prices haven't changed since the last save."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            # Name the commit after the day of the prices, not the day the job ran.
            DAY=$(python -c "import json; print(json.load(open('data/catalog.json'))['updated'])")
            git commit -m "Prices for $DAY"
            # If someone pushed code while this ran, put the price commit on top of it.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Vercel to rebuild (only if nothing was pushed)
        if: steps.commit.outputs.pushed == 'false'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "The VERCEL_DEPLOY_HOOK secret is missing. See the setup notes at the top of this file."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
          echo "Rebuild started. Check the Deployments tab on Vercel."
